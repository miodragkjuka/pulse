---
- name: Configure pulse-server
  hosts: pulse_servers
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure base packages are installed
      ansible.builtin.apt:
        name:
          - curl
          - ufw
          - ca-certificates
        state: present

    - name: Set timezone
      community.general.timezone:
        name: Europe/Skopje

    - name: Allow SSH through the firewall
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Set firewall default to deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Enable the firewall
      community.general.ufw:
        state: enabled

    - name: Disable SSH password authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: "PasswordAuthentication no\n"
        owner: root
        group: root
        mode: "0644"
        validate: "sshd -t -f %s"
      notify: Restart ssh

    - name: Remove the old (ineffective) hardening file
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        state: absent
      notify: Restart ssh

    - name: Allow Kubernetes API through the firewall
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp

    - name: Check if k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Download the k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"
      when: not k3s_binary.stat.exists

    - name: Install k3s
      ansible.builtin.command: /tmp/k3s-install.sh
      when: not k3s_binary.stat.exists

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
