apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pulse
  template:
    metadata:
      labels:
        app: pulse
    spec:
      containers:
        - name: pulse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PULSE_SITES
              value: {{ .Values.pulseSites | quote }}
